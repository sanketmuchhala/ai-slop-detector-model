seed: 42
run_name: "deberta-v3-raid-detector"

model:
  name: "microsoft/deberta-v3-base"
  num_labels: 2
  use_lora: false
  num_dropout: 5
  dropout_rate: 0.2

data:
  dataset: "wiki_human_ai"
  train_on_raid: true
  raid_include_adversarial: true
  raid_extra_split: false
  max_length: 512
  val_size: 0.1
  test_size: 0.1

training:
  learning_rate: 2e-5
  num_epochs: 5
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 4
  weight_decay: 0.01
  warmup_ratio: 0.06
  max_grad_norm: 1.0
  label_smoothing_factor: 0.05
  lr_scheduler_type: "cosine"
  fp16: true
  bf16: false
  gradient_checkpointing: true
  layer_decay: 0.9
  save_strategy: "epoch"
  eval_strategy: "epoch"
  metric_for_best_model: "eval_auc"
  greater_is_better: true
  load_best_model_at_end: true
  save_total_limit: 2
  logging_steps: 50
  dataloader_num_workers: 4

eval:
  raid_split: "train"
  raid_include_adversarial: true
  fpr_targets: [0.001, 0.005, 0.01, 0.02, 0.05]
  tpr_targets: [0.80, 0.90, 0.95]
  threshold_sweep_steps: 1000

calibration:
  conservative_max_fpr: 0.01
  balanced_target_tpr: 0.90

export:
  onnx: false
  model_version: "v1.0.0"

output:
  runs_dir: "runs"